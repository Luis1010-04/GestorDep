components:
  schemas:
    Baja:
      type: object
      additionalProperties: false
      required: [jugador_id, motivo, fecha, creado_en]
      properties:
        jugador_id:
          type: string
          format: uuid
        motivo:
          type: string
        fecha:
          type: string
          format: date
        creado_en:
          type: string
          format: date-time
    JugadorBuscado:
      type: object
      additionalProperties: false
      description: Resultado de la busqueda por matricula (RN-20); no incluye identificador.
      required: [nombres, apellidos, matricula]
      properties:
        nombres:
          type: string
        apellidos:
          type: string
        matricula:
          type: string
    Jugador:
      type: object
      additionalProperties: false
      required: [id, nombres, apellidos, fecha_nacimiento, matricula, estatus_academico, estatus_deportivo, equipos, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombres:
          type: string
        apellidos:
          type: string
        fecha_nacimiento:
          type: string
          format: date
        matricula:
          type: string
        estatus_academico:
          type: string
          enum: [activo, baja]
        estatus_deportivo:
          type: string
          enum: [activo, baja]
        equipos:
          type: array
          description: Solo los equipos donde el usuario que consulta es entrenador (RN-14).
          items:
            type: object
            additionalProperties: false
            required: [equipo_id, nombre, categoria, posicion]
            properties:
              equipo_id:
                type: string
                format: uuid
              nombre:
                type: string
              categoria:
                type: object
                additionalProperties: false
                required: [id, nombre]
                properties:
                  id:
                    type: string
                    format: uuid
                  nombre:
                    type: string
              posicion:
                type: string
                enum: [portero, defensa, medio, delantero]
        actualizado_en:
          type: string
          format: date-time
    Categoria:
      type: object
      additionalProperties: false
      required: [id, nombre, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        actualizado_en:
          type: string
          format: date-time
    Inscripcion:
      type: object
      additionalProperties: false
      required: [id, materia_id, jugador, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        materia_id:
          type: string
          format: uuid
        jugador:
          type: object
          additionalProperties: false
          required: [id, nombres, apellidos, matricula]
          properties:
            id:
              type: string
              format: uuid
            nombres:
              type: string
            apellidos:
              type: string
            matricula:
              type: string
        actualizado_en:
          type: string
          format: date-time
    SituacionAcademica:
      type: object
      additionalProperties: false
      required: [periodo, promedio, materias_reprobadas, materias_sin_calificar, dato_incompleto, porcentaje_asistencia, nivel_riesgo, calculado_en]
      properties:
        periodo:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, nombre]
          description: El periodo vigente (DD-45); nulo si hoy no cae en ningun periodo.
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
        promedio:
          type: string
          nullable: true
          pattern: '^\d{1,2}\.\d{2}$'
        materias_reprobadas:
          type: integer
        materias_sin_calificar:
          type: integer
        dato_incompleto:
          type: boolean
        porcentaje_asistencia:
          type: string
          nullable: true
          pattern: '^\d{1,3}\.\d{2}$'
        nivel_riesgo:
          type: string
          nullable: true
          enum: [sin_riesgo, en_observacion, en_riesgo, null]
        calculado_en:
          type: string
          nullable: true
          format: date-time
        materias:
          type: array
          description: >-
            Solo para quien es docente del jugador, y solo sus propias materias del periodo vigente (DD-48). Ausente
            para el entrenador.
          items:
            type: object
            additionalProperties: false
            required: [materia_id, asignatura, calificacion, criterio, aprobada, calificaciones]
            properties:
              materia_id:
                type: string
                format: uuid
              asignatura:
                type: object
                additionalProperties: false
                required: [clave, nombre]
                properties:
                  clave:
                    type: string
                  nombre:
                    type: string
              calificacion:
                type: string
                nullable: true
                pattern: '^\d{1,2}\.\d{2}$'
                description: La final si existe; si no, la media de los parciales (RN-02); nula sin calificaciones.
              criterio:
                type: object
                additionalProperties: false
                required: [ambito, calificacion_minima]
                description: El criterio vigente de la materia (DD-47).
                properties:
                  ambito:
                    type: string
                    enum: [general, materia]
                  calificacion_minima:
                    type: string
                    pattern: '^\d{1,2}\.\d{2}$'
              aprobada:
                type: boolean
                nullable: true
              calificaciones:
                type: array
                items:
                  $ref: '#/components/schemas/Calificacion'
    Asistencia:
      type: object
      additionalProperties: false
      required: [id, inscripcion_id, fecha, estado, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        inscripcion_id:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        estado:
          type: string
          enum: [presente, falta, falta_justificada]
        actualizado_en:
          type: string
          format: date-time
    Calificacion:
      type: object
      additionalProperties: false
      required: [id, inscripcion_id, tipo, numero_parcial, valor, criterio, fecha, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        inscripcion_id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [parcial, final]
        numero_parcial:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: Nulo si es la final.
        valor:
          type: string
          pattern: '^\d{1,2}\.\d{2}$'
        criterio:
          type: object
          additionalProperties: false
          required: [ambito, calificacion_minima]
          description: El criterio de aprobacion vigente al capturar (DD-47); no cambia si el criterio cambia despues.
          properties:
            ambito:
              type: string
              enum: [general, materia]
            calificacion_minima:
              type: string
              pattern: '^\d{1,2}\.\d{2}$'
        fecha:
          type: string
          format: date
        actualizado_en:
          type: string
          format: date-time
    Criterio:
      type: object
      additionalProperties: false
      required: [ambito, calificacion_minima, vigente_desde]
      properties:
        ambito:
          type: string
          enum: [general, materia]
        calificacion_minima:
          type: string
          pattern: '^\d{1,2}\.\d{2}$'
        vigente_desde:
          type: string
          format: date
    Materia:
      type: object
      additionalProperties: false
      required: [id, asignatura, periodo, criterio_aplicado, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        asignatura:
          type: object
          additionalProperties: false
          required: [id, clave, nombre]
          properties:
            id:
              type: string
              format: uuid
            clave:
              type: string
            nombre:
              type: string
        periodo:
          type: object
          additionalProperties: false
          required: [id, nombre]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
        criterio_aplicado:
          type: object
          additionalProperties: false
          required: [ambito, calificacion_minima]
          properties:
            ambito:
              type: string
              enum: [general, materia]
            calificacion_minima:
              type: string
              pattern: '^\d{1,2}\.\d{2}$'
        actualizado_en:
          type: string
          format: date-time
    Asignatura:
      type: object
      additionalProperties: false
      required: [id, clave, nombre, grado, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        clave:
          type: string
        nombre:
          type: string
        grado:
          type: integer
          minimum: 1
          maximum: 12
        actualizado_en:
          type: string
          format: date-time
    PeriodoEscolar:
      type: object
      additionalProperties: false
      required: [id, nombre, fecha_inicio, fecha_fin, vigente, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        vigente:
          type: boolean
        actualizado_en:
          type: string
          format: date-time
    Equipo:
      type: object
      additionalProperties: false
      required: [id, nombre, categoria, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        categoria:
          type: object
          additionalProperties: false
          required: [id, nombre]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
        actualizado_en:
          type: string
          format: date-time
    Lugar:
      type: object
      additionalProperties: false
      required: [id, nombre, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        actualizado_en:
          type: string
          format: date-time
    Rival:
      type: object
      additionalProperties: false
      required: [id, nombre, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        actualizado_en:
          type: string
          format: date-time
    Temporada:
      type: object
      additionalProperties: false
      required: [id, nombre, fecha_inicio, fecha_fin, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        actualizado_en:
          type: string
          format: date-time
    Torneo:
      type: object
      additionalProperties: false
      required: [id, nombre, temporada_id, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        temporada_id:
          type: string
          format: uuid
        actualizado_en:
          type: string
          format: date-time
    Usuario:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, roles]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [docente, entrenador]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, errores]
      properties:
        codigo:
          type: string
          description: Codigo estable en snake_case; no se traduce.
          pattern: '^[a-z][a-z0-9]*(_[a-z0-9]+)*$'
        mensaje:
          type: string
          description: Mensaje traducido desde lang/es.
        errores:
          type: array
          description: Detalle por campo; vacio si el error no es de campo.
          items:
            $ref: '#/components/schemas/ErrorDeCampo'
    ErrorDeCampo:
      type: object
      additionalProperties: false
      required: [campo, codigo, mensaje]
      properties:
        campo:
          type: string
        codigo:
          type: string
        mensaje:
          type: string
