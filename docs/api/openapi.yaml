                $ref: '#/components/schemas/Error'
        '403':
          description: Sin el rol entrenador (sin_permiso) o sin ser el registrante del estado (no_es_registrante).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            El estado vigente es apto (sin_lesion_vigente), o hubo un choque con otra escritura o con un estado abierto en
            el mismo segundo (conflicto, DA-30).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Cuerpo invalido o con campos desconocidos (validacion_fallida), o fecha anterior al inicio de la lesion
            (rango_de_fechas_invalido, DA-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /jugadores/{jugador}/mediciones:
    get:
      operationId: listarMediciones
      summary: Lista las mediciones del jugador que registro el usuario
      description: >-
        Entrenador del jugador (HU-17 c3, DD-59). Solo las que el usuario registro, por periodo ascendente (DA-06). Sigue
        disponible con el jugador en baja.
      tags: [Condicion fisica]
