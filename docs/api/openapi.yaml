                  format: date-time
                lugar_id:
                  type: string
                  format: uuid
                rival_id:
                  type: string
                  format: uuid
                torneo_id:
                  type: string
                  format: uuid
                  nullable: true
                tipo:
                  type: string
                  enum: [amistoso, oficial, interno, torneo]
                condicion:
                  type: string
                  enum: [local, visitante]
                estado:
                  type: string
                  enum: [cancelado]
