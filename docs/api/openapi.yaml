      description: >-
        Solo entrenadores del equipo (HU-12). El jugador debe tener membresia vigente en el equipo del partido y no
        estar en baja (DA-28); si no, el mismo 404 que un jugador inexistente. No valida elegibilidad (RN-18). Solo en
        un partido programado. Escribe su historial (RNF-02).
      tags: [Convocatoria]
      parameters:
        - name: partido
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jugador_id]
              properties:
                jugador_id:
                  type: string
                  format: uuid
