      operationId: definirAlineacion
      summary: Reemplaza la alineacion completa de un partido
      description: >-
        Solo entrenadores del equipo del partido (HU-13), en un partido programado. Cada jugador debe estar en la
        convocatoria visible (DA-32) y cada posicion en el catalogo posiciones (DA-31). Quien no esta en la lista queda
        sin posicion ni rol; una lista vacia deja a todos sin alineacion. Responde la convocatoria visible completa.
        Una sola transaccion, con historial por fila que cambia.
      tags: [Convocatoria]
      parameters:
        - name: partido
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [alineacion]
              properties:
                alineacion:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [jugador_id, posicion_id, rol_alineacion]
                    properties:
                      jugador_id:
                        type: string
                        format: uuid
                      posicion_id:
                        type: string
                        format: uuid
                      rol_alineacion:
                        type: string
                        enum: [titular, suplente]
      responses:
        '200':
          description: La convocatoria con la alineacion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Convocatoria'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            El partido no existe o el usuario no entrena su equipo; o un jugador de la alineacion esta fuera de su
            alcance (inexistente, de otro equipo o en baja aunque haya estado convocado, DA-34). Mismo cuerpo
            (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El partido no esta programado (partido_no_programado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Lista ausente, con formato invalido o un jugador repetido (validacion_fallida); jugador no convocado
            (jugador_no_convocado, campo alineacion.N.jugador_id, solo para un jugador visible); posicion inexistente
            (posicion_inexistente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partidos/{partido}/resultado:
    put:
      operationId: capturarResultado
      summary: Captura el resultado de un partido programado
      description: >-
        Solo entrenadores del equipo del partido (HU-13). El partido pasa a jugado. Un partido jugado o cancelado no
        admite resultado (409); el resultado no se corrige (§2.3). Primero el estado y despues el rango (DA-33).
      tags: [Partidos]
      parameters:
        - name: partido
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [goles_favor, goles_contra]
              properties:
                goles_favor:
                  type: integer
                  minimum: 0
                  maximum: 99
                goles_contra:
                  type: integer
                  minimum: 0
                  maximum: 99
      responses:
        '200':
          description: El partido jugado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Partido'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El partido no existe o el usuario no entrena su equipo (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El partido no esta programado (partido_no_programado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Goles ausentes o que no son enteros, o un campo no admitido (validacion_fallida); goles fuera de 0 a 99
            (valor_fuera_de_rango, campo goles_favor o goles_contra).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /metricas:
    get:
      operationId: listarMetricas
      summary: Catalogo de metricas activas con sus posiciones
      description: >-
        Solo entrenadores (HU-14). Metricas activas ordenadas por codigo, con las posiciones en que se capturan (por
        identificador; sin nombres de posicion) y si son obligatorias. Minimo y maximo como enteros en una metrica
        entera y como cadena con dos decimales en una decimal (DD-22). No se editan desde la API (§2.3).
      tags: [Rendimiento]
      responses:
        '200':
          description: El catalogo, sin paginar.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetricaDelCatalogo'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partidos/pendientes-de-rendimiento:
    get:
      operationId: listarPendientesDeRendimiento
      summary: Partidos jugados con convocados sin rendimiento
      description: >-
        Solo entrenadores (HU-14). Partidos jugados de los equipos del entrenador con al menos un convocado visible
        (AlcanceDeJugadores, sin bajas) al que el entrenador que consulta no le ha registrado rendimiento; los
        rendimientos de otro entrenador no cuentan (v1.0.8, DA-36, DD-17). Del mas reciente al mas antiguo. Vive en
        Consultas (docs/arquitectura.md §4.3).
      tags: [Rendimiento]
      parameters:
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
      responses:
        '200':
          description: Pagina de partidos pendientes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartidoPendienteDeRendimiento'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partidos/{partido}/rendimientos:
    get:
      operationId: listarRendimientosDelPartido
      summary: Lista los rendimientos del partido que registro el usuario
      description: >-
        Solo entrenadores del equipo del partido (HU-14). Un partido ajeno, inexistente o con un UUID que no es v7
        responde el mismo 404, antes que el 422. Solo los rendimientos que registro el usuario, de jugadores en su
        alcance (con bajas, DA-12): otro entrenador del mismo equipo no ve los suyos (RN-14). En orden de captura.
      tags: [Rendimiento]
      parameters:
        - name: partido
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
      responses:
        '200':
          description: Pagina de rendimientos.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rendimiento'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El partido no existe o el usuario no entrena su equipo (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: capturarRendimiento
      summary: Captura el rendimiento de un jugador en un partido jugado
      description: >-
        Solo entrenadores del equipo (HU-14). El orden de las comprobaciones es (DA-11): partido ajeno o inexistente
        (404, antes de validar el cuerpo); tipos del cuerpo (422); partido no jugado (409); jugador fuera del alcance,
        inexistente o en baja (el mismo 404); jugador no convocado (422); captura previa del jugador en el partido
        (409); rangos de los datos de juego, en el orden de los campos; metricas de la posicion del jugador en el
        equipo (DD-05): que apliquen, que esten las obligatorias y que cada valor este en el rango de su metrica.
        Escribe el rendimiento, sus valores y el historial de cada fila en una transaccion (RNF-02).
      tags: [Rendimiento]
      parameters:
        - name: partido
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jugador_id, minutos, fue_titular, tarjetas_amarillas, tarjetas_rojas, calificacion_general, metricas]
              properties:
                jugador_id:
                  type: string
                  format: uuid
                minutos:
                  type: integer
                  minimum: 0
                  maximum: 150
                fue_titular:
                  type: boolean
                tarjetas_amarillas:
                  type: integer
                  minimum: 0
                  maximum: 2
                tarjetas_rojas:
                  type: integer
                  minimum: 0
                  maximum: 1
                calificacion_general:
                  type: integer
                  minimum: 1
                  maximum: 10
                observacion:
                  type: string
                  nullable: true
                  maxLength: 500
                metricas:
                  type: array
                  items:
                    $ref: '#/components/schemas/ValorDeMetricaEntrada'
      responses:
        '201':
          description: Rendimiento capturado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Rendimiento'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            El partido no existe o el usuario no entrena su equipo; o el jugador no existe, esta fuera de su alcance o
            en baja. Mismo cuerpo (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            El partido no esta jugado (partido_no_jugado) o el usuario ya capturo a ese jugador en el partido
            (rendimiento_duplicado, campo jugador_id). El rendimiento que capturo otro entrenador no cuenta ni se revela
            (v1.0.8, RN-14).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Un campo ausente, con tipo invalido, una metrica repetida o un campo no admitido (validacion_fallida);
            jugador visible no convocado (jugador_no_convocado, campo jugador_id); un valor fuera de rango
            (valor_fuera_de_rango, campo minutos, tarjetas_amarillas, tarjetas_rojas, calificacion_general, observacion
            o metricas.N.valor); una metrica que no es de la posicion (metrica_no_aplica_a_posicion, campo
            metricas.N.metrica_id); falta una obligatoria (metrica_obligatoria_faltante, campo metricas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rendimientos/{rendimiento}:
    patch:
      operationId: corregirRendimiento
      summary: Corrige un rendimiento que registro el usuario
      description: >-
        Solo quien lo registro (HU-14, §3.3). Un rendimiento de otro entrenador, aunque sea del mismo equipo, uno
        inexistente o con un UUID que no es v7 responden el mismo 404, antes que el 422 (RN-14). Acepta cualquier campo
        de la captura salvo jugador_id; metricas reemplaza la lista y se valida contra la posicion con que se capturo.
        Escribe el historial de cada fila que cambia (RNF-02). El codigo rendimiento_no_editable queda reservado: en H4
        no hay ningun caso que lo devuelva (§6.3).
      tags: [Rendimiento]
      parameters:
        - name: rendimiento
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                minutos:
                  type: integer
                  minimum: 0
                  maximum: 150
                fue_titular:
                  type: boolean
                tarjetas_amarillas:
                  type: integer
                  minimum: 0
                  maximum: 2
                tarjetas_rojas:
                  type: integer
                  minimum: 0
                  maximum: 1
                calificacion_general:
                  type: integer
                  minimum: 1
                  maximum: 10
                observacion:
                  type: string
                  nullable: true
                  maxLength: 500
                metricas:
                  type: array
                  items:
                    $ref: '#/components/schemas/ValorDeMetricaEntrada'
      responses:
        '200':
          description: El rendimiento corregido.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Rendimiento'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            El rendimiento no existe, lo registro otro entrenador, el usuario no entrena el equipo o el jugador esta
            fuera de su alcance (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Cuerpo vacio (campo cuerpo), tipo invalido o campo no admitido, como jugador_id (validacion_fallida); un
            valor fuera de rango (valor_fuera_de_rango); una metrica que no es de la posicion
            (metrica_no_aplica_a_posicion); falta una obligatoria (metrica_obligatoria_faltante).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /plantillas-evaluacion:
    get:
      operationId: listarPlantillasEvaluacion
      summary: Plantillas de fabrica y propias del entrenador
      description: >-
        Solo entrenadores (HU-15). Las de fabrica y las que creo el usuario, nunca las de otro entrenador (§5.3). Las de
        fabrica primero, despues por nombre. Un filtro[posicion_id] con UUID valido que no es v7 da una lista vacia;
        uno que no es UUID, 422 (DA-26 de H3, v1.0.4 §6.1).
      tags: [Rendimiento]
      parameters:
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
        - name: filtro[posicion_id]
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Pagina de plantillas.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlantillaEvaluacion'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Paginacion o filtro invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: crearPlantillaEvaluacion
      summary: Crea una plantilla propia para una posicion
      description: >-
        Solo entrenadores (HU-15, RN-07). La plantilla queda a nombre del usuario (creada_por) y nunca es de fabrica.
        No hay ruta para editarla ni borrarla (v1.0.4 §2.3). Escribe el historial (RNF-02). El codigo
        plantilla_de_fabrica queda reservado: en H4 no hay ningun caso que lo devuelva, porque ninguna ruta edita ni borra
        plantillas (§6.3).
      tags: [Rendimiento]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nombre, posicion_id, calificacion_minima, ventana_partidos]
              properties:
                nombre:
                  type: string
                  maxLength: 100
                posicion_id:
                  type: string
                  format: uuid
                calificacion_minima:
                  $ref: '#/components/schemas/CalificacionMinimaEntrada'
                ventana_partidos:
                  type: integer
                  minimum: 1
                  maximum: 32767
                  description: El maximo es un limite tecnico (smallint), no una regla de negocio (v1.0.4 §6.2).
      responses:
        '201':
          description: La plantilla creada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/PlantillaEvaluacion'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            El usuario ya tiene una plantilla con ese nombre en la posicion, o hay una de fabrica con ese nombre en la
            posicion (plantilla_duplicada, campo nombre). Las plantillas de otros entrenadores no cuentan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Tipo invalido o campo no admitido (validacion_fallida); posicion inexistente o con UUID que no es v7
            (posicion_inexistente); calificacion o ventana fuera de rango (valor_fuera_de_rango).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /equipos/{equipo}/jugadores/{jugador}/umbral:
    parameters:
      - name: equipo
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: jugador
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: consultarUmbral
      summary: Umbral del jugador en el equipo para el entrenador
      description: >-
        Solo un entrenador del equipo (HU-15). Devuelve su umbral vigente para el jugador en ese equipo o, si no tiene,
        la plantilla de fabrica de la posicion del jugador en el equipo (DD-05). Un equipo que no entrena, un jugador
        fuera de su alcance o sin posicion en el equipo, o un UUID que no es v7, responden el mismo 404.
      tags: [Rendimiento]
      responses:
        '200':
          description: El umbral que se aplica.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Umbral'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Equipo o jugador no encontrados para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Sin umbral propio y sin plantilla de fabrica para la posicion del jugador (codigo sin_umbral_aplicable;
            §6.3 v1.0.6, DA-33).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: fijarUmbral
      summary: Fija el umbral del jugador en el equipo
      description: >-
        Solo un entrenador del equipo (HU-15). Con plantilla_id copia los valores de una plantilla visible de la
        posicion del jugador; con calificacion_minima y ventana_partidos (juntas) usa valores propios; sin nada copia la
        plantilla de fabrica de la posicion. Cierra el umbral vigente (vigente_hasta) y abre uno nuevo, cada uno con su
        historial, en una transaccion; el primero no cierra nada. Solo afecta al jugador, en ese equipo, para el
        usuario. El 404 va antes que el 422 (§6.1).
      tags: [Rendimiento]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plantilla_id:
                  type: string
                  format: uuid
                calificacion_minima:
                  $ref: '#/components/schemas/CalificacionMinimaEntrada'
                ventana_partidos:
                  type: integer
                  minimum: 1
                  maximum: 32767
                  description: El maximo es un limite tecnico (smallint), no una regla de negocio (v1.0.4 §6.2).
      responses:
        '200':
          description: El umbral nuevo.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Umbral'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            El usuario no entrena el equipo, el jugador esta fuera de su alcance o sin posicion en el equipo, o un UUID
            no es v7 (codigo recurso_no_encontrado). Un jugador en baja no da 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Otro cambio simultaneo del umbral del mismo jugador, equipo y entrenador choco con el indice del umbral
            vigente; no se escribe nada (codigo conflicto, sin campo; §6.3 v1.0.5, DA-27). Sin cuerpo y sin plantilla
            de fabrica para la posicion del jugador (codigo sin_umbral_aplicable; §6.3 v1.0.6, DA-33).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Tipo invalido, calificacion sin ventana o al reves, o campo no admitido (validacion_fallida); plantilla_id
            junto con valores propios (umbral_ambiguo); plantilla inexistente, de otro entrenador o con UUID que no es
            v7 (plantilla_inexistente); plantilla de otra posicion (plantilla_de_otra_posicion); calificacion o ventana
            fuera de rango (valor_fuera_de_rango).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /equipos/{equipo}/jugadores/{jugador}/desempeno:
    get:
      operationId: consultarDesempeno
      summary: Pasa, no pasa o datos insuficientes del jugador en el equipo
      description: >-
        Solo un entrenador del equipo (HU-16, RN-08). Devuelve la ultima evaluacion guardada para el usuario (cada
        captura, correccion o cambio de umbral inserta una) o, si no hay ninguna, la calcula sin guardarla, con
        calculado_en a la hora actual. Solo cuentan las calificaciones que el usuario registro del jugador en ese
        equipo, ordenadas por fecha del partido; el promedio de las ultimas N (N es la ventana) se redondea a dos
        decimales y ese promedio redondeado se compara con la calificacion minima (§3.3, v1.0.5). Un equipo que no
        entrena, un jugador fuera de su alcance o sin posicion en el equipo, o un UUID que no es v7, responden el mismo
        404 (RN-14).
      tags: [Rendimiento]
      parameters:
        - name: equipo
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: jugador
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: El desempeno.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Desempeno'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Equipo o jugador no encontrados para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Sin evaluacion guardada, sin umbral propio y sin plantilla de fabrica para la posicion del jugador (codigo
            sin_umbral_aplicable; §6.3 v1.0.6, DA-33).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /jugadores/{jugador}/avisos-lesion:
    get:
      operationId: listarAvisosDeLesion
      summary: Lista los avisos de lesion de un jugador
      description: >-
        Entrenador o docente del jugador (HU-19, DD-56). Quien lo entrena ve todos sus avisos; quien solo le da clase,
        los que el creo, aunque tenga tambien el rol entrenador (§5.3, DA-25). Ordenados por fecha_aviso y por id,
        descendentes. Sigue disponible con el jugador en baja (DA-12). La nota solo la ven quien la escribio y quien
        confirmo el aviso (DD-58); la nota del descarte, quien descarto y quien creo el aviso (DA-11); a los demas se
        les devuelven nulas. Un jugador fuera del alcance, inexistente o con un UUID que no es v7 responde el mismo 404,
        tambien para un docente que creo un aviso y perdio el alcance.
      tags: [Salud]
      parameters:
        - name: jugador
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
      responses:
        '200':
          description: Pagina de avisos.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvisoDeLesion'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador ni docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: crearAvisoDeLesion
      summary: Crea un aviso de molestia o lesion
      description: >-
        Entrenador o docente del jugador (HU-19). El aviso queda pendiente y el estado oficial no cambia. La fecha puede
        ser futura (DA-23). El 404 gana sobre el 422, y el 422 sobre el 409 jugador_en_baja (DA-24). Escribe su historial
        (RNF-02).
      tags: [Salud]
      parameters:
        - name: jugador
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nota, fecha]
              properties:
                nota: {type: string, maxLength: 500}
                fecha: {type: string, format: date}
                reportado_por_jugador: {type: boolean, default: false}
      responses:
        '201':
          description: El aviso creado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/AvisoDeLesion'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador ni docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El jugador esta en baja (jugador_en_baja, DD-60).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Cuerpo invalido o con campos desconocidos (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /avisos-lesion/{aviso}/descarte:
