          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Cuerpo vacio (campo cuerpo), campo no admitido (prohibited) o con formato invalido (validacion_fallida);
            sin_temporada; torneo_obligatorio; torneo_de_otra_temporada; lugar_inexistente; rival_inexistente;
            torneo_inexistente.
