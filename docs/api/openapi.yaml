openapi: 3.0.3
info:
  title: GestorDep API
  version: 0.1.0
  description: >-
    API de seguimiento academico y deportivo de futbolistas (Fase 1).
    Convenciones de formato y de errores en docs/convenciones-api.md.
servers:
  - url: /api/v1
paths:
  /salud:
    get:
      operationId: consultarSalud
      summary: Estado de la aplicacion y de la base de datos
      tags: [Salud]
      responses:
        '200':
          description: La aplicacion y la base de datos responden.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    type: object
                    additionalProperties: false
                    required: [aplicacion, base_de_datos]
                    properties:
                      aplicacion:
                        type: string
                        enum: [ok]
                      base_de_datos:
                        type: string
                        enum: [ok]
        '503':
          description: La aplicacion no alcanza la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sanctum/csrf-cookie:
    servers:
      - url: /
    get:
      operationId: obtenerCookieCsrf
      summary: Entrega la cookie XSRF-TOKEN y abre la sesion (ruta estandar de Sanctum, fuera de /api/v1)
      tags: [Sesion]
      responses:
        '204':
          description: Cookie entregada.
  /sesion:
    post:
      operationId: iniciarSesion
      summary: Inicia sesion con correo y contrasena
      description: >-
        Cinco contrasenas incorrectas seguidas bloquean la cuenta 15 minutos (RNF-10).
        Un usuario inexistente, desactivado o con contrasena incorrecta responde siempre lo mismo.
      tags: [Sesion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [correo, contrasena]
              properties:
                correo:
                  type: string
                contrasena:
                  type: string
      responses:
        '200':
          description: Sesion iniciada; el identificador de sesion se regenera.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Usuario'
        '401':
          description: Credenciales invalidas (codigo credenciales_invalidas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Falta el correo o la contrasena (codigo validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Cuenta bloqueada (codigo cuenta_bloqueada).
          headers:
            Retry-After:
              description: Segundos que faltan para que termine el bloqueo.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Usuario:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, roles]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [docente, entrenador]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, errores]
      properties:
        codigo:
          type: string
          description: Codigo estable en snake_case; no se traduce.
          pattern: '^[a-z][a-z0-9]*(_[a-z0-9]+)*$'
        mensaje:
          type: string
          description: Mensaje traducido desde lang/es.
        errores:
          type: array
          description: Detalle por campo; vacio si el error no es de campo.
          items:
            $ref: '#/components/schemas/ErrorDeCampo'
    ErrorDeCampo:
      type: object
      additionalProperties: false
      required: [campo, codigo, mensaje]
      properties:
        campo:
          type: string
        codigo:
          type: string
        mensaje:
          type: string
