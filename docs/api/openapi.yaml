        cambiar inicia_en se vuelve a derivar la temporada; al cambiar inicia_en, tipo o torneo_id se revalida el
        torneo sobre el resultado final (DA-25); torneo_id null quita el torneo. estado solo admite cancelado, desde
        programado. Una sola fila de historial.
