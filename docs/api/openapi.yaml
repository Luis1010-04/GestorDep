          schema: {type: string, format: uuid}
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
      responses:
        '200':
          description: Pagina de inscripciones.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inscripcion'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La materia no existe o no es del usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: inscribirJugador
      summary: Inscribe a un jugador en una materia del docente, por matricula
      description: >-
        Solo el docente dueño de la materia (HU-06, RN-20). La matricula se recorta y se compara sin distinguir
        mayusculas (DD-37). Inscribir otorga al docente el alcance sobre el jugador. Escribe el registro crear en
        inscripciones_historial en la misma transaccion y publica JugadorInscrito. Una materia ajena o
        inexistente responde el mismo 404 antes de validar el cuerpo y de buscar la matricula (DD-50).
      tags: [Materias]
      parameters:
        - name: materia
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [matricula]
              properties:
                matricula:
                  type: string
                  maxLength: 30
      responses:
        '201':
          description: Jugador inscrito.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Inscripcion'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            La materia no existe o no es del usuario (recurso_no_encontrado), o no hay un expediente con esa
            matricula (jugador_no_registrado; el cuerpo no incluye datos de nadie).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El jugador ya esta inscrito en la materia (jugador_ya_inscrito) o esta en baja (jugador_en_baja, DD-52).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Matricula ausente, vacia, de solo espacios o de mas de 30 caracteres (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /equipos:
    get:
      operationId: listarEquipos
