openapi: 3.0.3
info:
  title: GestorDep API
  version: 0.1.0
  description: >-
    API de seguimiento academico y deportivo de futbolistas (Fase 1).
    Convenciones de formato y de errores en docs/convenciones-api.md.
servers:
  - url: /api/v1
paths:
  /salud:
    get:
      operationId: consultarSalud
      summary: Estado de la aplicacion y de la base de datos
      tags: [Salud]
      responses:
        '200':
          description: La aplicacion y la base de datos responden.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    type: object
                    additionalProperties: false
                    required: [aplicacion, base_de_datos]
                    properties:
                      aplicacion:
                        type: string
                        enum: [ok]
                      base_de_datos:
                        type: string
                        enum: [ok]
        '503':
          description: La aplicacion no alcanza la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sanctum/csrf-cookie:
    servers:
      - url: /
    get:
      operationId: obtenerCookieCsrf
      summary: Entrega la cookie XSRF-TOKEN y abre la sesion (ruta estandar de Sanctum, fuera de /api/v1)
      tags: [Sesion]
      responses:
        '204':
          description: Cookie entregada.
  /sesion:
    post:
      operationId: iniciarSesion
      summary: Inicia sesion con correo y contrasena
      description: >-
        Cinco contrasenas incorrectas seguidas bloquean la cuenta 15 minutos (RNF-10).
        Un usuario inexistente, desactivado o con contrasena incorrecta responde siempre lo mismo.
      tags: [Sesion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [correo, contrasena]
              properties:
                correo:
                  type: string
                contrasena:
                  type: string
      responses:
        '200':
          description: Sesion iniciada; el identificador de sesion se regenera.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Usuario'
        '401':
          description: Credenciales invalidas (codigo credenciales_invalidas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Falta el correo o la contrasena (codigo validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Cuenta bloqueada (codigo cuenta_bloqueada).
          headers:
            Retry-After:
              description: Segundos que faltan para que termine el bloqueo.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: cerrarSesion
      summary: Cierra la sesion actual
      description: La cookie de sesion deja de ser valida; usarla de nuevo responde 401 (HU-27).
      tags: [Sesion]
      responses:
        '204':
          description: Sesion cerrada.
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contrasena:
    put:
      operationId: cambiarContrasena
      summary: Cambia la contrasena del usuario con sesion
      description: >-
        Cierra las demas sesiones del usuario y conserva la actual (HU-27).
        La contrasena nueva debe tener al menos 10 caracteres (RNF-10).
      tags: [Sesion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contrasena_actual, contrasena_nueva]
              properties:
                contrasena_actual:
                  type: string
                contrasena_nueva:
                  type: string
      responses:
        '204':
          description: Contrasena cambiada; las demas sesiones del usuario se cerraron.
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Falta un campo (validacion_fallida), la contrasena actual es incorrecta
            (contrasena_actual_incorrecta) o la nueva es muy corta (contrasena_muy_corta, campo contrasena_nueva).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categorias:
    get:
      operationId: listarCategorias
      summary: Lista las categorias vigentes
      description: Solo entrenadores (HU-28). Excluye las eliminadas; orden por nombre.
      tags: [Categorias]
      parameters:
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
        - name: orden
          in: query
          schema: {type: string, enum: [nombre, '-nombre'], default: nombre}
      responses:
        '200':
          description: Pagina de categorias.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Categoria'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no es entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion u orden invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: crearCategoria
      summary: Da de alta una categoria
      description: Solo entrenadores (HU-28). Queda disponible para todos los entrenadores.
      tags: [Categorias]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nombre]
              properties:
                nombre:
                  type: string
                  maxLength: 100
      responses:
        '201':
          description: Categoria creada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Categoria'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no es entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe una categoria vigente con ese nombre, sin distinguir mayusculas (categoria_duplicada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Nombre ausente, vacio o de mas de 100 caracteres (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categorias/{id}:
    delete:
      operationId: eliminarCategoria
      summary: Elimina logicamente una categoria
      description: >-
        Solo entrenadores (HU-28). Fija eliminado_en y eliminado_por; la fila se conserva y los equipos
        que la usan siguen mostrandola. El nombre puede darse de alta de nuevo.
      tags: [Categorias]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Categoria eliminada.
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no es entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La categoria no existe o ya estaba eliminada (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /periodos-escolares:
    get:
      operationId: listarPeriodosEscolares
      summary: Lista los periodos escolares vigentes
      description: >-
        Solo docentes (HU-28, DD-49). Excluye los eliminados; orden por defecto -fecha_inicio. Solo uno tiene
        vigente verdadero: el que contiene el dia de hoy y tiene la fecha_inicio mas reciente (DD-45).
      tags: [Periodos escolares]
      parameters:
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
        - name: orden
          in: query
          schema: {type: string, enum: [fecha_inicio, '-fecha_inicio'], default: '-fecha_inicio'}
      responses:
        '200':
          description: Pagina de periodos escolares.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeriodoEscolar'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion u orden invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: crearPeriodoEscolar
      summary: Da de alta un periodo escolar
      description: Solo docentes (HU-28, DD-49). Se permite el traslape de periodos.
      tags: [Periodos escolares]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nombre, fecha_inicio, fecha_fin]
              properties:
                nombre:
                  type: string
                  maxLength: 100
                fecha_inicio:
                  type: string
                  format: date
                fecha_fin:
                  type: string
                  format: date
      responses:
        '201':
          description: Periodo creado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/PeriodoEscolar'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe un periodo vigente con ese nombre, sin distinguir mayusculas (periodo_duplicado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Campo ausente o con formato invalido (validacion_fallida) o fecha_fin no posterior a
            fecha_inicio (rango_de_fechas_invalido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /periodos-escolares/{id}:
    delete:
      operationId: eliminarPeriodoEscolar
      summary: Elimina logicamente un periodo escolar
      description: >-
        Solo docentes (HU-28, DD-49). Fija eliminado_en y eliminado_por; la fila se conserva y las materias que
        lo usan siguen mostrandolo. El nombre puede darse de alta de nuevo.
      tags: [Periodos escolares]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Periodo eliminado.
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El periodo no existe o ya estaba eliminado (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /asignaturas:
    get:
      operationId: listarAsignaturas
      summary: Lista las asignaturas vigentes
      description: Solo docentes (HU-28, DD-49). Excluye las eliminadas; orden por defecto clave.
      tags: [Asignaturas]
      parameters:
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
        - name: orden
          in: query
          schema: {type: string, enum: [clave, '-clave'], default: clave}
      responses:
        '200':
          description: Pagina de asignaturas.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asignatura'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion u orden invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: crearAsignatura
      summary: Da de alta una asignatura
      description: Solo docentes (HU-28, DD-49).
      tags: [Asignaturas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clave, nombre, grado]
              properties:
                clave:
                  type: string
                  maxLength: 20
                nombre:
                  type: string
                  maxLength: 150
                grado:
                  type: integer
                  minimum: 1
                  maximum: 12
      responses:
        '201':
          description: Asignatura creada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Asignatura'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe una asignatura vigente con esa clave, sin distinguir mayusculas (asignatura_duplicada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Campo ausente, vacio, demasiado largo o grado fuera de 1 a 12 (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /asignaturas/{id}:
    delete:
      operationId: eliminarAsignatura
      summary: Elimina logicamente una asignatura
      description: >-
        Solo docentes (HU-28, DD-49). Fija eliminado_en y eliminado_por; la fila se conserva y las materias que
        la usan siguen mostrandola. La clave puede darse de alta de nuevo.
      tags: [Asignaturas]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Asignatura eliminada.
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La asignatura no existe o ya estaba eliminada (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /materias:
    get:
      operationId: listarMaterias
      summary: Lista las materias del docente que consulta
      description: >-
        Solo docentes (HU-06, DD-49). Devuelve unicamente las materias cuyo docente es el usuario; orden por
        clave de la asignatura. La asignatura y el periodo se muestran aunque esten eliminados.
      tags: [Materias]
      parameters:
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
        - name: filtro[periodo_id]
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Pagina de materias.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Materia'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion o filtro invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: crearMateria
      summary: Da de alta una materia del docente que consulta
      description: >-
        Solo docentes (HU-06). El docente de la materia es el usuario actual. Escribe el registro crear en
        materias_historial en la misma transaccion.
      tags: [Materias]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asignatura_id, periodo_id]
              properties:
                asignatura_id:
                  type: string
                  format: uuid
                periodo_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Materia creada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Materia'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El docente ya tiene una materia con esa asignatura en ese periodo (materia_duplicada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Campo ausente o UUID mal formado (validacion_fallida), asignatura inexistente o eliminada
            (asignatura_inexistente) o periodo inexistente o eliminado (periodo_inexistente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /materias/{materia}:
    get:
      operationId: verMateria
      summary: Consulta una materia del docente que consulta
      description: >-
        Solo el docente dueño de la materia (HU-06, HU-08). Una materia ajena, inexistente o con id que no es v7
        responde el mismo 404 (DD-50). criterio_aplicado es el criterio propio vigente de la materia si lo tiene y,
        si no, el general vigente (RN-03).
      tags: [Materias]
      parameters:
        - name: materia
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: La materia.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Materia'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La materia no existe o no es del usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /materias/{materia}/criterio:
    put:
      operationId: definirCriterioDeMateria
      summary: Define el criterio de aprobacion propio de una materia
      description: >-
        Solo el docente dueño de la materia (HU-08, RN-03). Un valor distinto del vigente cierra el criterio propio
        vigente (vigente_hasta = hoy) y crea el nuevo, con sus historiales, en una transaccion, y publica
        CriterioDeMateriaModificado para recalcular los resumenes de los inscritos. Un valor igual al vigente
        responde 200 sin escribir nada. Una materia ajena, inexistente o con id que no es v7 responde el mismo
        404 antes de validar el cuerpo (DD-50).
      tags: [Materias]
      parameters:
        - name: materia
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [calificacion_minima]
              properties:
                calificacion_minima:
                  type: string
                  description: Cadena de 0.00 a 10.00 con hasta dos decimales; un numero JSON se rechaza (DD-51).
                  pattern: '^-?\d+(\.\d{1,2})?$'
      responses:
        '200':
          description: El criterio propio vigente.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Criterio'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La materia no existe o no es del usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Valor ausente, no cadena o con formato invalido (validacion_fallida) o numerico fuera de 0 a 10
            (calificacion_fuera_de_rango, campo calificacion_minima).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /materias/{materia}/inscripciones:
    get:
      operationId: listarInscripciones
      summary: Lista los alumnos de una materia del docente
      description: >-
        Solo el docente dueño de la materia (HU-06). Pasa por AlcanceDeJugadores: los jugadores en baja no
        aparecen (DD-30). Orden por apellidos y nombres. Una materia ajena, inexistente o con id que no es v7
        responde el mismo 404 (DD-50).
      tags: [Materias]
      parameters:
        - name: materia
          in: path
