                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Convocatoria'
                  advertencias:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [codigo, mensaje]
                      properties:
                        codigo:
                          type: string
                          enum: [jugador_lesionado]
                        mensaje:
                          type: string
                        campo:
                          type: string
                          description: Campo de la peticion al que se refiere (jugador_id).
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
