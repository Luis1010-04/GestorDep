  /avisos-lesion/{aviso}/confirmacion:
    post:
      operationId: confirmarAvisoDeLesion
      summary: Confirma un aviso como estado oficial
      description: >-
        Solo un entrenador del jugador (HU-20, DD-61). Con lesionado o con_molestia, tipo, zona, causa y
        fecha_estimada_regreso son obligatorios; con apto, esos campos y la nota estan prohibidos (DD-57). Quien confirma
        queda como unico registrante y el estado nuevo sustituye al vigente, sea de quien sea (DD-63). Con apto, si el
        estado vigente tiene una lesion sin fecha_alta registrada por quien confirma, esa lesion recibe fecha_alta igual al
        hoy de negocio, salvo si su fecha_inicio es posterior; la lesion de otro registrante no cambia (DA-76). Un aviso
        ajeno, inexistente o con un UUID que no es v7 responde el mismo 404, antes que el 422. Escribe su historial
        (RNF-02).
      tags: [Salud]
      parameters:
        - name: aviso
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [estado]
              properties:
                estado: {type: string, enum: [apto, con_molestia, lesionado]}
                tipo: {type: string, maxLength: 100}
                zona: {type: string, maxLength: 100}
                causa: {type: string, enum: [entrenamiento, partido, otra]}
                fecha_estimada_regreso: {type: string, format: date}
                nota: {type: string, maxLength: 500}
      responses:
        '200':
          description: El aviso confirmado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/AvisoDeLesion'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Aviso no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            El aviso ya no esta pendiente (aviso_no_pendiente), el jugador esta en baja (jugador_en_baja, DA-12), o hubo un
            choque con otra escritura o con un estado abierto en el mismo segundo (conflicto, DA-30).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Cuerpo invalido o con campos desconocidos (validacion_fallida), o fecha estimada anterior a la fecha del aviso
            (rango_de_fechas_invalido, DA-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /jugadores/{jugador}/estado-disponibilidad:
    get:
      operationId: consultarEstadoDeDisponibilidad
      summary: Consulta el estado oficial vigente de un jugador
      description: >-
        Entrenador o docente del jugador (HU-21, HU-04 c3). Sin ningun registro, el jugador esta apto con es_implicito
        verdadero (DA-01). Todos ven el mismo estado y la misma fecha; lesion_id solo lo recibe el registrante (DA-18).
        requiere_actualizacion se calcula al leer (DA-09). Sigue disponible con el jugador en baja.
      tags: [Salud]
      parameters:
        - name: jugador
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: El estado oficial.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/EstadoDeDisponibilidad'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador ni docente (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: cambiarEstadoDeDisponibilidad
      summary: Cambia el estado o la fecha estimada de regreso
      description: >-
        Solo el registrante del estado (HU-30 c2, HU-20 c3). Un cambio de estado cierra la fila vigente y abre otra; solo
        la fecha actualiza la vigente (DA-14). Con valores identicos responde 200 sin escribir historial. Orden de los
        errores: 403 por rol, 404 por alcance, 422 por cuerpo, 409 sin_lesion_vigente, 403 no_es_registrante, 409
        jugador_en_baja.
      tags: [Salud]
      parameters:
        - name: jugador
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                estado: {type: string, enum: [con_molestia, lesionado]}
                fecha_estimada_regreso: {type: string, format: date}
      responses:
        '200':
          description: El estado oficial resultante.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/EstadoDeDisponibilidad'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin el rol entrenador (sin_permiso) o sin ser el registrante del estado (no_es_registrante).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            El estado vigente es apto (sin_lesion_vigente), el jugador esta en baja (jugador_en_baja, DA-12), o hubo un
            choque con otra escritura o con un estado abierto en el mismo segundo (conflicto, DA-30).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Cuerpo vacio, invalido o con campos desconocidos (validacion_fallida), o fecha anterior al inicio de la lesion
            (rango_de_fechas_invalido, DA-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /jugadores/{jugador}/estado-disponibilidad/alta:
