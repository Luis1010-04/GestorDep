          description: >-
            Jugador convocado. Desde H5 (HU-12 c3) puede llevar la advertencia jugador_lesionado si el jugador tiene
            estado oficial lesionado, con campo jugador_id; la convocatoria se guarda igual y el mensaje no lleva
