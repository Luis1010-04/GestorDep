            schema:
              type: object
              additionalProperties: false
              required: [registros]
              properties:
                registros:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [jugador_id, estado]
                    properties:
                      jugador_id:
                        type: string
                        format: uuid
                      estado:
                        type: string
                        enum: [presente, falta, falta_justificada]
      responses:
        '201':
          description: >-
            Registros creados, en el orden recibido. Desde H5 (HU-11 c2) puede llevar advertencias
            jugador_lesionado, una por cada jugador de la lista con estado oficial lesionado; su campo senala el
            elemento de la lista (registros.N.jugador_id) y el mensaje no lleva datos del jugador
            (docs/convenciones-api.md §4).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/AsistenciaDeEntrenamiento'
                  advertencias:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [codigo, mensaje]
                      properties:
                        codigo:
                          type: string
                          enum: [jugador_lesionado]
                        mensaje:
                          type: string
                        campo:
                          type: string
                          description: Elemento de la lista al que se refiere (por ejemplo, registros.0.jugador_id).
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El entrenamiento no existe o el usuario no entrena su equipo (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            El entrenamiento no esta realizado (entrenamiento_no_realizado) o algun jugador ya tiene asistencia
            registrada en el (asistencia_ya_registrada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Lista ausente, vacia, con un jugador repetido o con formato invalido (validacion_fallida); jugador sin
            membresia vigente en el equipo o en baja (jugador_no_pertenece_al_equipo, campo registros.N.jugador_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
