            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La convocatoria no existe o el usuario no entrena el equipo del partido (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
