          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
      responses:
        '200':
          description: Pagina de mediciones.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Medicion'
