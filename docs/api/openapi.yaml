      description: >-
        Solo entrenadores (HU-03). Devuelve unicamente los equipos con asignacion vigente del usuario
        (RN-22); orden por nombre. La categoria se muestra aunque haya sido eliminada.
      tags: [Equipos]
      parameters:
        - name: pagina
