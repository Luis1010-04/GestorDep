    post:
      operationId: programarPartido
      summary: Programa un partido del equipo
      description: >-
        Solo entrenadores del equipo (HU-12). La temporada no se envia: es la que contiene el dia local de inicia_en en
        America/Mexico_City (§3.4, DD-07). El torneo es obligatorio en oficial y torneo y, si se indica, debe ser de esa
        temporada. La categoria se toma del equipo (DD-18). Escribe su historial (RNF-02).
      tags: [Partidos]
      parameters:
        - name: equipo
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inicia_en, lugar_id, rival_id, tipo, condicion]
              properties:
                inicia_en:
                  type: string
                  format: date-time
                  description: ISO 8601 con zona (desplazamiento o Z).
                lugar_id:
                  type: string
                  format: uuid
                rival_id:
                  type: string
                  format: uuid
                torneo_id:
                  type: string
                  format: uuid
                  nullable: true
                tipo:
                  type: string
                  enum: [amistoso, oficial, interno, torneo]
                condicion:
                  type: string
                  enum: [local, visitante]
      responses:
        '201':
          description: Partido programado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Partido'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El equipo no existe o el usuario no lo entrena (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Campo ausente, con formato invalido o no admitido (validacion_fallida); sin_temporada (campo inicia_en);
            torneo_obligatorio o torneo_de_otra_temporada (campo torneo_id); lugar_inexistente, rival_inexistente o
            torneo_inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
