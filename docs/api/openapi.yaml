                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: registrarMedicion
      summary: Registra una medicion o la corrige con confirmacion
      description: >-
        Entrenador del jugador (HU-17, docs/convenciones-api.md 4.1). El periodo se deriva de fecha (DA-03) y el IMC se
        calcula (DA-05). Orden de errores (DA-38): 403 rol, 404 alcance, 422 cuerpo, 409 jugador_en_baja, 422
        equipo_inexistente, 422 valor_fuera_de_rango, 422 nada_que_corregir, 409 medicion_ya_registrada, 409 conflicto.
      tags: [Condicion fisica]
      parameters:
        - name: jugador
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [equipo_id, peso_kg, estatura_cm]
              properties:
                equipo_id:
                  type: string
                  format: uuid
                  description: Equipo que el usuario entrena y donde el jugador tiene membresia vigente (DA-13).
                peso_kg:
                  type: string
                  description: Hasta dos decimales. El rango sale de rangos_mediciones_corporales (DA-16).
                  example: '70.00'
                estatura_cm:
                  type: string
                  description: Hasta un decimal. El rango sale de rangos_mediciones_corporales (DA-16).
                  example: '175.0'
                fecha:
                  type: string
                  format: date
                  description: Opcional; por defecto, el hoy de negocio. Puede ser futura (DA-03).
                es_correccion:
                  type: boolean
                  default: false
                motivo:
                  type: string
                  maxLength: 255
                  description: >-
                    Obligatorio con es_correccion; hasta 255 caracteres (DA-44). Sin es_correccion responde 422 prohibited
                    (DA-39).
      responses:
        '200':
          description: Correccion confirmada. Con valores identicos no escribe historial (DA-40).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Medicion'
        '201':
          description: Medicion registrada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Medicion'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            jugador_en_baja (DD-60, DA-12), medicion_ya_registrada (ya hay una del usuario en el periodo, sin es_correccion)
            o conflicto (dos registros simultaneos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            validacion_fallida, equipo_inexistente (mismo cuerpo si no existe, esta eliminado, es ajeno o no tiene al
            jugador; DA-13), valor_fuera_de_rango en peso_kg o estatura_cm (tambien si el IMC no cabe en su columna, en
            estatura_cm; DA-71), rango_no_configurado si falta el rango de la medida (DA-70), o nada_que_corregir en
            es_correccion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tipos-prueba:
    get:
      operationId: listarTiposDePrueba
      summary: Lista el catalogo de tipos de prueba
      description: >-
        Rol entrenador (HU-18). Los tipos vigentes por codigo ascendente, sin paginar: no lee pagina ni por_pagina (DA-63).
      tags: [Condicion fisica]
      responses:
        '200':
          description: Catalogo de tipos de prueba.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/TipoDePrueba'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /jugadores/{jugador}/pruebas-fisicas:
    get:
      operationId: listarPruebasFisicas
      summary: Lista las pruebas fisicas del jugador que registro el usuario, o la vista de un periodo
      description: >-
        Entrenador del jugador (HU-18, DD-59). Sin filtro[periodo], el listado paginado de las pruebas del usuario, por
        periodo ascendente y, dentro del periodo, por codigo del tipo. Con filtro[periodo], la vista del periodo: un
        elemento por tipo, por codigo ascendente, con prueba nula si no hay, sin paginar y sin leer pagina ni por_pagina
        (HU-18 c3, DA-63). Con los dos filtros, la vista solo trae ese tipo (DA-62). Un filtro[tipo_prueba_id] que es UUID
        pero no v7 da una lista vacia (DA-26 de H3). Sigue disponible con el jugador en baja.
      tags: [Condicion fisica]
      parameters:
        - name: jugador
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: filtro[periodo]
          in: query
          description: AAAA-MM; otro formato responde 422 validacion_fallida.
          schema: {type: string}
        - name: filtro[tipo_prueba_id]
          in: query
          schema: {type: string, format: uuid}
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
      responses:
        '200':
          description: Pagina de pruebas, o la vista de un periodo con filtro[periodo].
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [datos, meta]
                    properties:
                      datos:
                        type: array
                        items:
                          $ref: '#/components/schemas/PruebaFisica'
                      meta:
                        type: object
                        additionalProperties: false
                        required: [pagina, por_pagina, total, total_paginas]
                        properties:
                          pagina: {type: integer}
                          por_pagina: {type: integer}
                          total: {type: integer}
                          total_paginas: {type: integer}
                  - type: object
                    additionalProperties: false
                    required: [datos]
                    properties:
                      datos:
                        type: array
                        items:
                          $ref: '#/components/schemas/ElementoDePeriodoDePruebas'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Filtro o parametro de paginacion invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: registrarPruebaFisica
      summary: Registra una prueba fisica o la corrige con confirmacion
      description: >-
        Entrenador del jugador (HU-18, docs/convenciones-api.md 4.1). El periodo se deriva de fecha (DA-03); una prueba
        por tipo, periodo y registrante (DA-04). Orden de errores (DA-58): 403 rol, 404 alcance, 422 cuerpo, 409
        jugador_en_baja, 422 equipo_inexistente, 422 tipo_prueba_inexistente, 422 valor_fuera_de_rango, 422
        nada_que_corregir, 409 prueba_ya_registrada, 409 conflicto. Un doble envio del mismo entrenador responde 409
        prueba_ya_registrada (DA-64).
      tags: [Condicion fisica]
      parameters:
        - name: jugador
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [equipo_id, tipo_prueba_id, resultado]
              properties:
                equipo_id:
                  type: string
                  format: uuid
                  description: Equipo que el usuario entrena y donde el jugador tiene membresia vigente (DA-13).
                tipo_prueba_id:
                  type: string
                  format: uuid
                  description: Un UUID no v7, un tipo eliminado y uno inexistente responden 422 tipo_prueba_inexistente (DA-61).
                resultado:
                  type: string
                  description: Hasta dos decimales. El rango sale de tipos_prueba.minimo y maximo (DA-16).
                  example: '4.35'
                fecha:
                  type: string
                  format: date
                  description: Opcional; por defecto, el hoy de negocio. Puede ser futura (DA-03).
                es_correccion:
                  type: boolean
                  default: false
                motivo:
                  type: string
                  maxLength: 255
                  description: >-
                    Obligatorio con es_correccion; hasta 255 caracteres (DA-44). Sin es_correccion responde 422 prohibited
                    (DA-39).
      responses:
        '200':
          description: Correccion confirmada. Con valores identicos no escribe historial (DA-40).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/PruebaFisica'
        '201':
          description: Prueba registrada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/PruebaFisica'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            jugador_en_baja (DD-60, DA-12), prueba_ya_registrada (ya hay una del usuario de ese tipo en el periodo, sin
            es_correccion; DA-04, DA-64) o conflicto (dos registros simultaneos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            validacion_fallida, equipo_inexistente (DA-13), tipo_prueba_inexistente (DA-61), valor_fuera_de_rango en
            resultado, o nada_que_corregir en es_correccion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /jugadores/{jugador}/lesiones:
    get:
      operationId: listarLesiones
      summary: Lista las lesiones del jugador que registro el usuario
      description: >-
        Entrenador del jugador (RN-15). Solo las que el usuario registro, por fecha_inicio y id descendentes (DA-31). Sigue
        disponible con el jugador en baja.
      tags: [Salud]
      parameters:
        - name: jugador
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: pagina
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: por_pagina
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 15}
      responses:
        '200':
          description: Pagina de lesiones.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos, meta]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lesion'
                  meta:
                    type: object
                    additionalProperties: false
                    required: [pagina, por_pagina, total, total_paginas]
                    properties:
                      pagina: {type: integer}
                      por_pagina: {type: integer}
                      total: {type: integer}
                      total_paginas: {type: integer}
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jugador no encontrado para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parametro de paginacion invalido (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /lesiones/{lesion}:
    get:
      operationId: consultarLesion
      summary: Consulta el detalle de una lesion
      description: >-
        Solo quien la registro, mientras entrene al jugador (RN-15). Para cualquier otro entrenador responde el mismo 404
        que una lesion inexistente.
      tags: [Salud]
      parameters:
        - name: lesion
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: La lesion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Lesion'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Lesion no encontrada para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: corregirLesion
      summary: Corrige el detalle de una lesion
      description: >-
        Solo quien la registro, mientras entrene al jugador (RN-16). La fecha estimada no se cambia aqui (DA-02). Con
        valores identicos responde 200 sin escribir historial. Se permite con el jugador en baja (DA-12).
      tags: [Salud]
      parameters:
        - name: lesion
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                tipo: {type: string, maxLength: 100}
                zona: {type: string, maxLength: 100}
                causa: {type: string, enum: [entrenamiento, partido, otra]}
                nota: {type: string, maxLength: 500}
      responses:
        '200':
          description: La lesion corregida.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datos]
                properties:
                  datos:
                    $ref: '#/components/schemas/Lesion'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Lesion no encontrada para el usuario (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Hubo un choque con otra escritura (conflicto, DA-79).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Cuerpo vacio, invalido o con campos desconocidos (validacion_fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    EstadoDeDisponibilidad:
      type: object
      additionalProperties: false
      required: [estado, fecha_estimada_regreso, vigente_desde, es_implicito, requiere_actualizacion, lesion_id, actualizado_en]
      properties:
        estado:
          type: string
          enum: [apto, con_molestia, lesionado]
        fecha_estimada_regreso:
          type: string
          format: date
          nullable: true
        vigente_desde:
          type: string
          format: date-time
          nullable: true
          description: Nula si es_implicito es verdadero (DA-01).
        es_implicito:
          type: boolean
        requiere_actualizacion:
          type: boolean
          description: Verdadero si el estado no es apto y su fecha estimada es anterior al hoy de negocio (DA-09).
        lesion_id:
          type: string
          format: uuid
          nullable: true
          description: Solo para el registrante; a los demas se les devuelve nulo (DA-18).
        actualizado_en:
          type: string
          format: date-time
          nullable: true
          description: >-
            Momento de la ultima actualizacion del estado, sin decir que cambio (RNF-04, DA-56). Nulo si es_implicito es
            verdadero (DA-01). Corregir el detalle de la lesion no lo cambia.
    Medicion:
      type: object
      additionalProperties: false
      required: [id, equipo_id, fecha, periodo, peso_kg, estatura_cm, imc, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        equipo_id:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        periodo:
          type: string
          description: AAAA-MM, derivado de fecha (DA-03).
          example: 2026-11
        peso_kg:
          type: string
          description: Dos decimales.
          example: '70.00'
        estatura_cm:
          type: string
          description: Un decimal.
          example: '175.0'
        imc:
          type: string
          description: Calculado, a dos decimales HALF_UP (DA-05).
          example: '22.86'
        actualizado_en:
          type: string
          format: date-time
    PruebaFisica:
      type: object
      additionalProperties: false
      required: [id, equipo_id, tipo_prueba_id, fecha, periodo, resultado, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        equipo_id:
          type: string
          format: uuid
        tipo_prueba_id:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        periodo:
          type: string
          description: AAAA-MM, derivado de fecha (DA-03).
          example: 2026-11
        resultado:
          type: string
          description: Dos decimales.
          example: '4.35'
        actualizado_en:
          type: string
          format: date-time
    ElementoDePeriodoDePruebas:
      type: object
      additionalProperties: false
      required: [tipo_prueba_id, periodo, prueba]
      properties:
        tipo_prueba_id:
          type: string
          format: uuid
        periodo:
          type: string
          example: 2026-11
        prueba:
          description: La prueba que registro el usuario en el periodo, o nula (HU-18 c3).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PruebaFisica'
    TipoDePrueba:
      type: object
      additionalProperties: false
      required: [id, codigo, nombre, unidad, mejor_resultado]
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          enum: [velocidad, resistencia, tiempo_prueba]
        nombre:
          type: string
        unidad:
          type: string
        mejor_resultado:
          type: string
          enum: [mayor, menor]
    Lesion:
      type: object
      additionalProperties: false
      required: [id, tipo, zona, causa, fecha_inicio, fecha_estimada_regreso, fecha_alta, nota, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
        zona:
          type: string
        causa:
          type: string
          enum: [entrenamiento, partido, otra]
        fecha_inicio:
          type: string
          format: date
        fecha_estimada_regreso:
          type: string
          format: date
          description: La que se registro al confirmar; no cambia despues (DA-02).
        fecha_alta:
          type: string
          format: date
          nullable: true
        nota:
          type: string
          nullable: true
        actualizado_en:
          type: string
          format: date-time
    AvisoDeLesion:
      type: object
      additionalProperties: false
      required: [id, estado, fecha_aviso, reportado_por_jugador, nota, nota_descarte, es_propio, creado_en, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [pendiente, confirmado, descartado]
        fecha_aviso:
          type: string
          format: date
        reportado_por_jugador:
          type: boolean
        nota:
          type: string
          nullable: true
          description: Nula para quien no la escribio ni confirmo el aviso (DD-58).
        nota_descarte:
          type: string
          nullable: true
          description: Nula para quien no descarto ni creo el aviso (DA-11).
        es_propio:
          type: boolean
          description: Si el usuario creo el aviso.
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time
    Baja:
      type: object
      additionalProperties: false
      required: [jugador_id, motivo, fecha, creado_en]
      properties:
        jugador_id:
          type: string
          format: uuid
        motivo:
          type: string
        fecha:
          type: string
          format: date
        creado_en:
          type: string
          format: date-time
    JugadorBuscado:
      type: object
      additionalProperties: false
      description: Resultado de la busqueda por matricula (RN-20); no incluye identificador.
      required: [nombres, apellidos, matricula]
      properties:
        nombres:
          type: string
        apellidos:
          type: string
        matricula:
          type: string
    Jugador:
      type: object
      additionalProperties: false
      required: [id, nombres, apellidos, fecha_nacimiento, matricula, estatus_academico, estatus_deportivo, equipos, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombres:
          type: string
        apellidos:
          type: string
        fecha_nacimiento:
          type: string
          format: date
        matricula:
          type: string
        estatus_academico:
          type: string
          enum: [activo, baja]
        estatus_deportivo:
          type: string
          enum: [activo, baja]
        equipos:
          type: array
          description: Solo los equipos donde el usuario que consulta es entrenador (RN-14).
          items:
            type: object
            additionalProperties: false
            required: [equipo_id, nombre, categoria, posicion]
            properties:
              equipo_id:
                type: string
                format: uuid
              nombre:
                type: string
              categoria:
                type: object
                additionalProperties: false
                required: [id, nombre]
                properties:
                  id:
                    type: string
                    format: uuid
                  nombre:
                    type: string
              posicion:
                type: string
                enum: [portero, defensa, medio, delantero]
        actualizado_en:
          type: string
          format: date-time
    Categoria:
      type: object
      additionalProperties: false
      required: [id, nombre, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        actualizado_en:
          type: string
          format: date-time
    Inscripcion:
      type: object
      additionalProperties: false
      required: [id, materia_id, jugador, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        materia_id:
          type: string
          format: uuid
        jugador:
          type: object
          additionalProperties: false
          required: [id, nombres, apellidos, matricula]
          properties:
            id:
              type: string
              format: uuid
            nombres:
              type: string
            apellidos:
              type: string
            matricula:
              type: string
        actualizado_en:
          type: string
          format: date-time
    SituacionAcademica:
      type: object
      additionalProperties: false
      required: [periodo, promedio, materias_reprobadas, materias_sin_calificar, dato_incompleto, porcentaje_asistencia, nivel_riesgo, calculado_en]
      properties:
        periodo:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, nombre]
          description: El periodo vigente (DD-45); nulo si hoy no cae en ningun periodo.
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
        promedio:
          type: string
          nullable: true
          pattern: '^\d{1,2}\.\d{2}$'
        materias_reprobadas:
          type: integer
        materias_sin_calificar:
          type: integer
        dato_incompleto:
          type: boolean
        porcentaje_asistencia:
          type: string
          nullable: true
          pattern: '^\d{1,3}\.\d{2}$'
        nivel_riesgo:
          type: string
          nullable: true
          enum: [sin_riesgo, en_observacion, en_riesgo, null]
        calculado_en:
          type: string
          nullable: true
          format: date-time
        materias:
          type: array
          description: >-
            Solo para quien es docente del jugador, y solo sus propias materias del periodo vigente (DD-48). Ausente
            para el entrenador.
          items:
            type: object
            additionalProperties: false
            required: [materia_id, asignatura, calificacion, criterio, aprobada, calificaciones]
            properties:
              materia_id:
                type: string
                format: uuid
              asignatura:
                type: object
                additionalProperties: false
                required: [clave, nombre]
                properties:
                  clave:
                    type: string
                  nombre:
                    type: string
              calificacion:
                type: string
                nullable: true
                pattern: '^\d{1,2}\.\d{2}$'
                description: La final si existe; si no, la media de los parciales (RN-02); nula sin calificaciones.
              criterio:
                type: object
                additionalProperties: false
                required: [ambito, calificacion_minima]
                description: El criterio vigente de la materia (DD-47).
                properties:
                  ambito:
                    type: string
                    enum: [general, materia]
                  calificacion_minima:
                    type: string
                    pattern: '^\d{1,2}\.\d{2}$'
              aprobada:
                type: boolean
                nullable: true
              calificaciones:
                type: array
                items:
                  $ref: '#/components/schemas/Calificacion'
    Asistencia:
      type: object
      additionalProperties: false
      required: [id, inscripcion_id, fecha, estado, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        inscripcion_id:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        estado:
          type: string
          enum: [presente, falta, falta_justificada]
        actualizado_en:
          type: string
          format: date-time
    Calificacion:
      type: object
      additionalProperties: false
      required: [id, inscripcion_id, tipo, numero_parcial, valor, criterio, fecha, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        inscripcion_id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [parcial, final]
        numero_parcial:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: Nulo si es la final.
        valor:
          type: string
          pattern: '^\d{1,2}\.\d{2}$'
        criterio:
          type: object
          additionalProperties: false
          required: [ambito, calificacion_minima]
          description: El criterio de aprobacion vigente al capturar (DD-47); no cambia si el criterio cambia despues.
          properties:
            ambito:
              type: string
              enum: [general, materia]
            calificacion_minima:
              type: string
              pattern: '^\d{1,2}\.\d{2}$'
        fecha:
          type: string
          format: date
        actualizado_en:
          type: string
          format: date-time
    Criterio:
      type: object
      additionalProperties: false
      required: [ambito, calificacion_minima, vigente_desde]
      properties:
        ambito:
          type: string
          enum: [general, materia]
        calificacion_minima:
          type: string
          pattern: '^\d{1,2}\.\d{2}$'
        vigente_desde:
          type: string
          format: date
    Materia:
      type: object
      additionalProperties: false
      required: [id, asignatura, periodo, criterio_aplicado, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        asignatura:
          type: object
          additionalProperties: false
          required: [id, clave, nombre]
          properties:
            id:
              type: string
              format: uuid
            clave:
              type: string
            nombre:
              type: string
        periodo:
          type: object
          additionalProperties: false
          required: [id, nombre]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
        criterio_aplicado:
          type: object
          additionalProperties: false
          required: [ambito, calificacion_minima]
          properties:
            ambito:
              type: string
              enum: [general, materia]
            calificacion_minima:
              type: string
              pattern: '^\d{1,2}\.\d{2}$'
        actualizado_en:
          type: string
          format: date-time
    Asignatura:
      type: object
      additionalProperties: false
      required: [id, clave, nombre, grado, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        clave:
          type: string
        nombre:
          type: string
        grado:
          type: integer
          minimum: 1
          maximum: 12
        actualizado_en:
          type: string
          format: date-time
    PeriodoEscolar:
      type: object
      additionalProperties: false
      required: [id, nombre, fecha_inicio, fecha_fin, vigente, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        vigente:
          type: boolean
        actualizado_en:
          type: string
          format: date-time
    Equipo:
      type: object
      additionalProperties: false
      required: [id, nombre, categoria, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        categoria:
          type: object
          additionalProperties: false
          required: [id, nombre]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
        actualizado_en:
          type: string
          format: date-time
    Lugar:
      type: object
      additionalProperties: false
      required: [id, nombre, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        actualizado_en:
          type: string
          format: date-time
    Rival:
      type: object
      additionalProperties: false
      required: [id, nombre, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        actualizado_en:
          type: string
          format: date-time
    Temporada:
      type: object
      additionalProperties: false
      required: [id, nombre, fecha_inicio, fecha_fin, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        actualizado_en:
          type: string
          format: date-time
    Torneo:
      type: object
      additionalProperties: false
      required: [id, nombre, temporada_id, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        temporada_id:
          type: string
          format: uuid
        actualizado_en:
          type: string
          format: date-time
    Entrenamiento:
      type: object
      additionalProperties: false
      required: [id, equipo_id, lugar_id, inicia_en, termina_en, responsable_id, estado, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        equipo_id:
          type: string
          format: uuid
        lugar_id:
          type: string
          format: uuid
        inicia_en:
          type: string
          format: date-time
        termina_en:
          type: string
          format: date-time
        responsable_id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [programado, realizado, cancelado]
        actualizado_en:
          type: string
          format: date-time
        jugadores_del_equipo:
          type: array
          description: Solo en el alta, el detalle y el cambio. Membresia vigente y sin baja (DA-12, DA-14).
          items:
            type: object
            additionalProperties: false
            required: [id, nombres, apellidos]
            properties:
              id:
                type: string
                format: uuid
              nombres:
                type: string
              apellidos:
                type: string
    RespuestaDeEntrenamiento:
      type: object
      additionalProperties: false
      required: [datos]
      properties:
        datos:
          allOf:
            - $ref: '#/components/schemas/Entrenamiento'
            - type: object
              required: [jugadores_del_equipo]
        advertencias:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [codigo, mensaje]
            properties:
              codigo:
                type: string
                enum: [empalme_de_lugar]
              mensaje:
                type: string
              campo:
                type: string
                description: >-
                  Opcional (docs/convenciones-api.md §4, desde H5). empalme_de_lugar no lo usa: la advertencia es de
                  todo el entrenamiento.
    AsistenciaDeEntrenamiento:
      type: object
      additionalProperties: false
      required: [id, entrenamiento_id, jugador_id, estado, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        entrenamiento_id:
          type: string
          format: uuid
        jugador_id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [presente, falta, falta_justificada]
        actualizado_en:
          type: string
          format: date-time
    PorcentajeDeAsistencia:
      type: string
      nullable: true
      pattern: '^[0-9]{1,3}\.[0-9]{2}$'
      description: Presentes entre todos los registros por 100, HALF_UP a dos decimales; nulo sin registros (§3.4).
    Partido:
      type: object
      additionalProperties: false
      description: Sin categoria, que se toma del equipo (DD-18).
      required: [id, equipo_id, temporada_id, torneo_id, rival_id, lugar_id, inicia_en, tipo, condicion, estado, goles_favor, goles_contra, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        equipo_id:
          type: string
          format: uuid
        temporada_id:
          type: string
          format: uuid
        torneo_id:
          type: string
          format: uuid
          nullable: true
        rival_id:
          type: string
          format: uuid
        lugar_id:
          type: string
          format: uuid
        inicia_en:
          type: string
          format: date-time
        tipo:
          type: string
          enum: [amistoso, oficial, interno, torneo]
        condicion:
          type: string
          enum: [local, visitante]
        estado:
          type: string
          enum: [programado, jugado, cancelado]
        goles_favor:
          type: integer
          nullable: true
          minimum: 0
          maximum: 99
        goles_contra:
          type: integer
          nullable: true
          minimum: 0
          maximum: 99
        actualizado_en:
          type: string
          format: date-time
    Convocatoria:
      type: object
      additionalProperties: false
      required: [id, partido_id, jugador_id, posicion_id, rol_alineacion, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        partido_id:
          type: string
          format: uuid
        jugador_id:
          type: string
          format: uuid
        posicion_id:
          type: string
          format: uuid
          nullable: true
        rol_alineacion:
          type: string
          enum: [titular, suplente]
          nullable: true
        actualizado_en:
          type: string
          format: date-time
    ValorDeMetricaEntrada:
      type: object
      additionalProperties: false
      required: [metrica_id, valor]
      properties:
        metrica_id:
          type: string
          format: uuid
        valor:
          type: integer
          description: Entero JSON; todas las metricas sembradas son enteras (DA-14). El rango es el de la metrica.
    Rendimiento:
      type: object
      additionalProperties: false
      description: Sin registrado_por; solo lo ve quien lo registro (RN-14).
      required: [id, partido_id, jugador_id, equipo_id, posicion_id, minutos, fue_titular, tarjetas_amarillas, tarjetas_rojas, calificacion_general, categoria_calificacion, observacion, metricas, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        partido_id:
          type: string
          format: uuid
        jugador_id:
          type: string
          format: uuid
        equipo_id:
          type: string
          format: uuid
        posicion_id:
          type: string
          format: uuid
          description: La posicion del jugador en el equipo al capturar (DD-05); no cambia con la membresia.
        minutos:
          type: integer
          minimum: 0
          maximum: 150
        fue_titular:
          type: boolean
        tarjetas_amarillas:
          type: integer
          minimum: 0
          maximum: 2
        tarjetas_rojas:
          type: integer
          minimum: 0
          maximum: 1
        calificacion_general:
          type: integer
          minimum: 1
          maximum: 10
        categoria_calificacion:
          type: string
          readOnly: true
          enum: [deficiente, regular, bueno, sobresaliente]
          description: >-
            Solo lectura, derivada de calificacion_general (RN-06, DD-09; v1.0.4): de 1 a 4 deficiente, de 5 a 6
            regular, de 7 a 8 bueno y de 9 a 10 sobresaliente.
        observacion:
          type: string
          nullable: true
        metricas:
          type: array
          description: En el orden de la posicion (metricas_posicion.orden).
          items:
            type: object
            additionalProperties: false
            required: [metrica_id, valor]
            properties:
              metrica_id:
                type: string
                format: uuid
              valor:
                $ref: '#/components/schemas/NumeroDeMetrica'
        actualizado_en:
          type: string
          format: date-time
    NumeroDeMetrica:
      description: Entero JSON en una metrica entera; cadena con dos decimales en una decimal (DD-22).
      oneOf:
        - type: integer
        - type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
    MetricaDelCatalogo:
      type: object
      additionalProperties: false
      required: [id, codigo, nombre, tipo_dato, minimo, maximo, posiciones]
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nombre:
          type: string
        tipo_dato:
          type: string
          enum: [entero, decimal]
        minimo:
          $ref: '#/components/schemas/NumeroDeMetrica'
        maximo:
          $ref: '#/components/schemas/NumeroDeMetrica'
        posiciones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [posicion_id, obligatoria, orden]
            properties:
              posicion_id:
                type: string
                format: uuid
              obligatoria:
                type: boolean
              orden:
                type: integer
    PartidoPendienteDeRendimiento:
      type: object
      additionalProperties: false
      required: [partido_id, equipo_id, inicia_en, convocados_sin_rendimiento]
      properties:
        partido_id:
          type: string
          format: uuid
        equipo_id:
          type: string
          format: uuid
        inicia_en:
          type: string
          format: date-time
        convocados_sin_rendimiento:
          type: integer
          minimum: 1
    Desempeno:
      type: object
      additionalProperties: false
      description: Resultado de RN-08 con el criterio aplicado (HU-16, §6.2). Sin identificadores de umbral ni de plantilla.
      required: [resultado, promedio, calificacion_minima, ventana_partidos, partidos_considerados, calculado_en]
      properties:
        resultado:
          type: string
          enum: [pasa, no_pasa, datos_insuficientes]
        promedio:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          nullable: true
          description: Nulo si y solo si el resultado es datos_insuficientes.
        calificacion_minima:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        ventana_partidos:
          type: integer
          minimum: 1
          maximum: 32767
        partidos_considerados:
          type: integer
          minimum: 0
        calculado_en:
          type: string
          format: date-time
          description: Nunca nulo; sin evaluaciones guardadas es la hora actual (v1.0.5).
    CalificacionMinimaEntrada:
      type: string
      pattern: '^-?\d+(\.\d{1,2})?$'
      description: Cadena con hasta dos decimales (DD-51). El rango, de 1 a 10, lo valida el dominio (valor_fuera_de_rango).
    PlantillaEvaluacion:
      type: object
      additionalProperties: false
      description: Sin creada_por; el entrenador solo ve las de fabrica y las suyas (§5.3, DA-19).
      required: [id, nombre, posicion_id, calificacion_minima, ventana_partidos, es_de_fabrica]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          maxLength: 100
        posicion_id:
          type: string
          format: uuid
        calificacion_minima:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        ventana_partidos:
          type: integer
          minimum: 1
          maximum: 32767
        es_de_fabrica:
          type: boolean
    Umbral:
      type: object
      additionalProperties: false
      description: >-
        El criterio que se aplica al jugador para el entrenador de la sesion (HU-15, v1.0.4 §6.2): su umbral vigente
        (origen umbral) o la plantilla de fabrica de su posicion (origen plantilla, con vigente_desde nulo).
      required: [origen, plantilla_id, calificacion_minima, ventana_partidos, vigente_desde]
      properties:
        origen:
          type: string
          enum: [umbral, plantilla]
        plantilla_id:
          type: string
          format: uuid
          nullable: true
          description: Nulo en un umbral con valores propios; en uno con plantilla, la plantilla de la que se copiaron.
        calificacion_minima:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        ventana_partidos:
          type: integer
          minimum: 1
          maximum: 32767
        vigente_desde:
          type: string
          format: date-time
          nullable: true
    Usuario:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, roles]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [docente, entrenador]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, errores]
      properties:
        codigo:
          type: string
          description: Codigo estable en snake_case; no se traduce.
          pattern: '^[a-z][a-z0-9]*(_[a-z0-9]+)*$'
        mensaje:
          type: string
          description: Mensaje traducido desde lang/es.
        errores:
          type: array
          description: Detalle por campo; vacio si el error no es de campo.
          items:
            $ref: '#/components/schemas/ErrorDeCampo'
    ErrorDeCampo:
      type: object
      additionalProperties: false
      required: [campo, codigo, mensaje]
      properties:
        campo:
          type: string
        codigo:
          type: string
        mensaje:
          type: string
