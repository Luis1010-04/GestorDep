          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El entrenamiento no existe o el usuario no entrena su equipo (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: modificarEntrenamiento
      summary: Modifica o cambia el estado de un entrenamiento
      description: >-
        Solo entrenadores del equipo (HU-10). El 404 gana al 422. Hora, lugar y responsable solo cambian en un
        entrenamiento programado (DA-08). El estado solo pasa de programado a realizado o cancelado. Los datos se
        aplican antes que el estado, con una sola fila de historial. Si sigue sin cancelar y su lugar se empalma, la
        respuesta lleva advertencias con empalme_de_lugar.
      tags: [Entrenamientos]
      parameters:
        - name: entrenamiento
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                inicia_en:
                  type: string
                  format: date-time
                termina_en:
                  type: string
                  format: date-time
                lugar_id:
                  type: string
                  format: uuid
                responsable_id:
                  type: string
                  format: uuid
                estado:
                  type: string
                  enum: [realizado, cancelado]
      responses:
        '200':
          description: El entrenamiento modificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDeEntrenamiento'
        '401':
          description: No hay sesion (codigo no_autenticado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene el rol entrenador (codigo sin_permiso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El entrenamiento no existe o el usuario no entrena su equipo (codigo recurso_no_encontrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Cambio de estado no permitido (transicion_no_permitida, campo estado), o cambio de datos de un entrenamiento
            que ya no esta programado (entrenamiento_no_programado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Cuerpo vacio (campo cuerpo), campo no admitido (prohibited) o con formato invalido (validacion_fallida);
            horario resultante invertido (rango_de_fechas_invalido); lugar_inexistente; responsable_no_asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
