      description: >-
        Solo un entrenador del jugador (HU-30 c3, DD-61). El estado oficial no cambia. Se permite con el jugador en baja
        (DA-12). Un aviso ajeno, inexistente o con un UUID que no es v7 responde el mismo 404, antes que el 422. Escribe
