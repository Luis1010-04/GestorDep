      operationId: listarPartidosDelEquipo
      summary: Lista los partidos de un equipo
      description: >-
        Solo entrenadores del equipo (HU-12); un equipo ajeno o inexistente responde 404, antes que el 422. Orden por
        defecto inicia_en. Un filtro[temporada_id] que no es de ninguna temporada da una lista vacia (DA-26).
